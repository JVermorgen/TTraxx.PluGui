name: Prerelease

on:
  push:
    branches: [main]

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Compute preview version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "0.1.0")
          echo "VERSION=${BASE_VERSION}-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ../nupkgs

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org (prerelease)
        run: dotnet nuget push "../nupkgs/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Unlist internal-only packages
        run: |
          dotnet nuget delete TTraxx.PluGui.Harness.NPlug.Core ${{ steps.version.outputs.VERSION }} \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --non-interactive